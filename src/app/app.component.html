<!-- Contenitore Principale Scurito -->
<div style="max-width: 600px; margin: 40px auto; font-family: sans-serif; padding: 20px; background-color: #1e1e1e; border: 1px solid #333; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
  
  <h2 style="color: #ffffff; text-align: center;">Il mio Assistente Qwen 2.5 🤖</h2>

  <!-- Input e Bottone -->
  <div style="display: flex; gap: 10px; margin-bottom: 20px;">
    <input 
      type="text" 
      [(ngModel)]="domanda" 
      placeholder="Chiedi qualcosa a Qwen (es. Cos'è l'URSS?)..." 
      style="flex: 1; padding: 12px; font-size: 16px; background-color: #2d2d2d; color: #ffffff; border: 1px solid #444; border-radius: 4px; outline: none;"
    >
    <button 
      (click)="inviaDomanda()" 
      [disabled]="staCaricando"
      style="padding: 12px 24px; font-size: 16px; cursor: pointer; background-color: #0d6efd; color: white; border: none; border-radius: 4px;"
    >
      {{ staCaricando ? 'Sto pensando...' : 'Invia' }}
    </button>
  </div>

  <!-- Area di caricamento -->
  <div *ngIf="staCaricando" style="text-align: center; color: #aaaaaa; font-style: italic;">
    Qwen sta elaborando la risposta in JSON tramite Spring Boot...
  </div>

  <!-- Area dei risultati in tema scuro -->
  <div *ngFor="let risposta of storicoRisposte" style="background-color: #2a2a2a; padding: 20px; border-radius: 6px; border-left: 4px solid #4ade80; margin-bottom: 20px;">
    <h3 style="margin-top: 0; color: #4ade80;">Risposta Ricevuta con successo!</h3>
    
    <p style="color: #d1d5db;"><strong>🧠 Argomento:</strong> {{ risposta.argomento }}</p>
    <p style="color: #d1d5db;"><strong>💻 Spiegazione Tecnica:</strong> {{ risposta.spiegazioneTecnica }}</p>
    <p style="color: #d1d5db;"><strong>💡 In parole povere:</strong> {{ risposta.riassuntoSemplice }}</p>
  </div>

</div>
